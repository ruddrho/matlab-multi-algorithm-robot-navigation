name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Run MATLAB smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            disp("Starting MATLAB repository smoke test...");

            % Verify MATLAB source files exist
            files = dir("*.m");
            assert(~isempty(files), "No MATLAB files found.");
            assert(isfile("main.m"), "main.m was not found.");

            % Verify project dependencies can be resolved
            dependencyFiles = ...
                matlab.codetools.requiredFilesAndProducts("main.m");
            assert(~isempty(dependencyFiles), ...
                "Could not resolve project dependencies.");

            % Verify shared project configuration
            cfg = utilities("defaultConfig");
            assert(isstruct(cfg), ...
                "defaultConfig did not return a structure.");
            assert(isfield(cfg,"compare"), ...
                "Comparison configuration is missing.");
            assert(isfield(cfg,"slam"), ...
                "SLAM configuration is missing.");
            assert(cfg.compare.enabled, ...
                "Multi-algorithm comparison is not enabled.");

            % Straight-motion kinematics test
            pose = robotKinematics([0;0;0],[1;0],0.1);
            expectedPose = [0.1;0;0];
            assert(norm(pose-expectedPose) < 1e-10, ...
                "Straight-motion kinematics test failed.");

            % Turning-motion kinematics sanity test
            turningPose = robotKinematics([0;0;0],[1;1],0.1);
            assert(all(isfinite(turningPose)), ...
                "Turning-motion kinematics returned invalid values.");
            assert(numel(turningPose) == 3, ...
                "robotKinematics returned an invalid pose.");

            disp("MATLAB repository smoke test passed.");
